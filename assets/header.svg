<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090979"/>
      <stop offset="0.55" stop-color="#4B0082"/>
      <stop offset="1" stop-color="#00A8CC"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="280" rx="24" fill="url(#g)"/>
  <circle cx="120" cy="60" r="70" fill="#ffffff" opacity="0.06">
    <animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="220" r="90" fill="#00D4FF" opacity="0.10">
    <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="50" r="40" fill="#FF9933" opacity="0.12">
    <animate attributeName="cx" values="780;820;780" dur="5s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="125" text-anchor="middle" font-size="72" font-weight="800" fill="#ffffff"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Raghuvendra Tiwari</text>
  <rect x="330" y="150" width="340" height="4" rx="2" fill="url(#line)"/>
  <text x="500" y="200" text-anchor="middle" font-size="28" fill="#C9F6FF" letter-spacing="1.5"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">Full-Stack Developer • Technical SEO • AI Builder</text>
  <text x="500" y="245" text-anchor="middle" font-size="22" fill="#FFB866"
        font-family="'Noto Sans Devanagari','Nirmala UI',Mangal,Arial,sans-serif">जय श्री राम</text>
</svg>
