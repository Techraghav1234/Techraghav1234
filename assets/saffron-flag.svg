<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1226"/>
    </linearGradient>
    <linearGradient id="saf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="340" rx="24" fill="url(#bg)" stroke="#FF9933" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Flag pole -->
  <rect x="128" y="34" width="12" height="270" rx="5" fill="url(#gold)"/>
  <circle cx="134" cy="28" r="13" fill="url(#gold)"/>
  <rect x="104" y="300" width="60" height="14" rx="6" fill="url(#gold)"/>

  <!-- Waving saffron flag -->
  <path fill="url(#saf)">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="M140,50 C340,20 540,80 860,50 L860,210 C540,240 340,180 140,210 Z;
              M140,50 C340,80 540,20 860,50 L860,210 C540,180 340,240 140,210 Z;
              M140,50 C340,20 540,80 860,50 L860,210 C540,240 340,180 140,210 Z"/>
  </path>

  <text x="500" y="105" text-anchor="middle" font-size="30" fill="#ffffff" opacity="0.9"
        font-family="'Noto Sans Devanagari','Nirmala UI',Mangal,Arial,sans-serif">ॐ</text>
  <text x="500" y="175" text-anchor="middle" font-size="62" font-weight="800" fill="#ffffff"
        font-family="'Noto Sans Devanagari','Nirmala UI',Mangal,Arial,sans-serif">जय श्री राम</text>

  <text x="500" y="270" text-anchor="middle" font-size="26" fill="#FFB866"
        font-family="'Noto Sans Devanagari','Nirmala UI',Mangal,Arial,sans-serif">गर्व से भारतीय  •  गर्व से हिंदू</text>
  <text x="500" y="308" text-anchor="middle" font-size="18" fill="#9aa4b2" letter-spacing="3"
        font-family="Segoe UI, Roboto, Arial, sans-serif">PROUD INDIAN • PROUD HINDU</text>
</svg>
